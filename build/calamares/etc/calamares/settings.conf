---
configuration-edition: "OpenNAS-Lite 1.0"

modules-search: [ local ]

instances:
- id:       welcome
  module:   welcome
  config:   welcome.conf

- id:       locale
  module:   locale
  config:   locale.conf

- id:       keyboard
  module:   keyboard
  config:   keyboard.conf

- id:       opennasprofile
  module:   opennasprofile
  config:   opennasprofile.conf

- id:       partition
  module:   partition
  config:   partition.conf

- id:       users
  module:   users
  config:   users.conf

- id:       packages
  module:   packages
  config:   packages.conf

- id:       mount
  module:   mount
  config:   mount.conf

- id:       opennaspartition
  module:   opennaspartition
  config:   opennaspartition.conf

- id:       machineid
  module:   machineid
  config:   machineid.conf

- id:       fstab
  module:   fstab
  config:   fstab.conf

- id:       grubcfg
  module:   grubcfg
  config:   grubcfg.conf

- id:       bootloader
  module:   bootloader
  config:   bootloader.conf

- id:       services-systemd
  module:   services-systemd
  config:   services-systemd.conf

- id:       umount
  module:   umount
  config:   umount.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - opennasprofile
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - opennaspartition
  - packages
  - machineid
  - fstab
  - users
  - grubcfg
  - bootloader
  - services-systemd
  - umount

branding: opennas

prompt-install: true
dont-chroot: false
