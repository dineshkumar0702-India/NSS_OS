name: Build OpenNAS-Lite ISO

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  lint-openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: bash build/scripts/lint-openapi.sh

  build-iso:
    runs-on: ubuntu-latest
    needs: lint-openapi
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install live-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build debootstrap squashfs-tools xorriso isolinux syslinux-utils \
            git rsync
      - name: Build web UI and ISO
        run: |
          bash build/scripts/prepare-iso-assets.sh
          sudo bash build/scripts/build-iso.sh
      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: opennas-lite-iso
          path: |
            build/output/*.iso
            build/output/*.sha256
          if-no-files-found: error
