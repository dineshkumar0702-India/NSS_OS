[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opennas-nasd"
version = "0.1.0"
description = "OpenNAS-Lite management daemon (nasd)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "argon2-cffi>=23.1.0",
  "python-multipart>=0.0.12",
  "httpx>=0.27.0",
  "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]

[project.scripts]
nasd = "nasd.__main__:main"
nasctl = "nasd.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nasd*"]

[tool.pytest.ini_options]
testpaths = ["../../tests"]
pythonpath = ["."]
asyncio_mode = "auto"
