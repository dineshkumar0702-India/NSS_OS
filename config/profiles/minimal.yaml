# OpenNAS-Lite install profile: Minimal (2 GB+ RAM)
name: minimal
description: >
  Lowest memory footprint. File services and core storage only.
  Docker, VMs, ZFS, and AI photo modules stay disabled until manually enabled.
ram_mb_minimum: 2048
feature_flags:
  docker: false
  zfs: false
  virtualization: false
  ai_photos: false
  clamav: false
services_enabled:
  - avahi-daemon
  - caddy
  - nftables
  - fail2ban
packages_extra: []
cgroup_defaults:
  nas_slice_memory_max: "512M"
