openapi: 3.1.0
info:
  title: OpenNAS-Lite Management API
  version: 1.0.0-phase1
  description: |
    Phase 1 stub. Full paths and schemas are expanded in Phase 3.
    See docs/architecture/api-design.md for narrative specification.
  license:
    name: GPL-3.0-or-later
    url: https://www.gnu.org/licenses/gpl-3.0.html
servers:
  - url: https://{host}/api/v1
    variables:
      host:
        default: opennas.local
  - url: http://127.0.0.1:8741/api/v1
    description: Local loopback (Caddy upstream)
tags:
  - name: auth
  - name: system
  - name: storage
  - name: shares
  - name: jobs
paths:
  /auth/login:
    post:
      tags: [auth]
      summary: Create session
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPublic'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/me:
    get:
      tags: [auth]
      summary: Current user
      operationId: authMe
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPublic'
  /system/status:
    get:
      tags: [system]
      summary: System health and version
      operationId: systemStatus
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'
  /system/capabilities:
    get:
      tags: [system]
      summary: Hardware and feature capabilities
      operationId: systemCapabilities
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
  /storage/disks:
    get:
      tags: [storage]
      summary: List block devices
      operationId: storageListDisks
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Disk'
  /storage/pools:
    get:
      tags: [storage]
      summary: List storage pools
      operationId: storageListPools
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Pool'
    post:
      tags: [storage]
      summary: Create pool (dry-run or confirm)
      operationId: storageCreatePool
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PoolCreateRequest'
      responses:
        '202':
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobRef'
        '200':
          description: Dry-run plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoolPlan'
  /jobs/{job_id}:
    get:
      tags: [jobs]
      summary: Job status
      operationId: jobsGet
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: nas_session
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    UserPublic:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        role:
          type: string
          enum: [viewer, operator, admin, owner]
    SystemStatus:
      type: object
      properties:
        version:
          type: string
        codename:
          type: string
          example: OpenNAS-Lite
        setup_complete:
          type: boolean
        uptime_seconds:
          type: integer
    Capabilities:
      type: object
      properties:
        profile:
          type: string
          enum: [minimal, standard, full]
        docker:
          type: boolean
        zfs:
          type: boolean
        virtualization:
          type: boolean
        ai_photos:
          type: boolean
    Disk:
      type: object
      properties:
        path:
          type: string
        size_bytes:
          type: integer
        model:
          type: string
        serial:
          type: string
        smart_status:
          type: string
    Pool:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        backend:
          type: string
          enum: [btrfs, mdadm, zfs]
        raid_level:
          type: string
        state:
          type: string
    PoolCreateRequest:
      type: object
      required: [name, backend, devices]
      properties:
        name:
          type: string
        backend:
          type: string
          enum: [btrfs, mdadm, zfs]
        raid_level:
          type: string
        devices:
          type: array
          items:
            type: string
        dry_run:
          type: boolean
          default: false
        confirm_token:
          type: string
          nullable: true
    PoolPlan:
      type: object
      properties:
        warnings:
          type: array
          items:
            type: string
        commands_preview:
          type: array
          items:
            type: string
        confirm_token:
          type: string
    JobRef:
      type: object
      properties:
        job_id:
          type: string
          format: uuid
    Job:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        state:
          type: string
          enum: [pending, running, success, failed]
        progress:
          type: integer
          minimum: 0
          maximum: 100
        message:
          type: string
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
